name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Bazaar + Myket release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleBazaarRelease assembleMyketRelease --no-daemon --stacktrace

      - name: Upload Bazaar APKs
        uses: actions/upload-artifact@v4
        with:
          name: SegaSim-bazaar
          path: app/build/outputs/apk/bazaar/**/*.apk

      - name: Upload Myket APKs
        uses: actions/upload-artifact@v4
        with:
          name: SegaSim-myket
          path: app/build/outputs/apk/myket/**/*.apk
